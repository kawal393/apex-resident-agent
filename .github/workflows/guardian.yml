name: guardian

# Every 15 minutes, forever, on GitHub's free runners. No server, no card, no GPU.
# Editing the guardian or this file also runs one tick, so a change proves itself.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "apex-guardian.mjs"
      - "board.mjs"
      - ".github/workflows/guardian.yml"

permissions:
  contents: write

concurrency:
  group: guardian
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: refuse to run a tree that carries a credential
        run: node gate.mjs

      - name: measure the live rail
        id: measure
        continue-on-error: true
        run: node apex-guardian.mjs | tee tick.log

      # A green run that wrote nothing is worse than a red one. This step makes "passed but
      # empty" impossible: the state file must be fresher than ten minutes or the run fails.
      - name: prove the tick actually ran
        run: |
          node -e "
          const s=require('./state.json');
          const age=Date.now()-Date.parse(s.lastTick);
          if(!Number.isFinite(age)||age>600000) throw new Error('state.json is '+(age/60000|0)+' minutes old — the guardian did not write this tick');
          if(s.filesChecked<1) throw new Error('the guardian recorded zero files');
          console.log('fresh',Math.round(age/1000)+'s, build',s.build,'files',s.filesChecked);
          "

      - name: render the board into the README
        run: node board.mjs

      - name: keep the memory
        run: |
          git config user.name "APEX Guardian"
          git config user.email "guardian@apex.invalid"
          git add state.json ledger/ status/data.json README.md
          git diff --cached --quiet || git commit -m "guardian: tick $(date -u +%FT%TZ) [skip ci]"
          git push

      - name: fail loudly when it found something
        run: |
          if node -e "const s=require('./state.json');process.exit(s.findings.length?1:0)"; then
            echo "clean"; else
            echo "::error::the guardian found something on the live rail — the board in this README says what"; exit 1;
          fi
